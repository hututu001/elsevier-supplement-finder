name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t supplement-finder:test .
      - name: Start and verify local web service
        run: |
          docker run -d --name supplement-finder-test -p 127.0.0.1:13006:13006 supplement-finder:test
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:13006/api/health
          curl --fail http://127.0.0.1:13006/ > /dev/null
          curl --fail http://127.0.0.1:13006/app.js > /dev/null
      - name: Container logs and cleanup
        if: always()
        run: docker logs supplement-finder-test; docker rm -f supplement-finder-test
